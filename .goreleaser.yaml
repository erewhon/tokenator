# GoReleaser — builds the `tokenator` CLI and publishes a Homebrew cask to
# smithy/homebrew-tap on code.middlefork.org on every `vX.Y.Z` tag.
# Docs: https://goreleaser.com
version: 2

project_name: tokenator

before:
  hooks:
    - go mod download

builds:
  - id: tokenator
    main: ./cmd/tokenator
    binary: tokenator
    env:
      - CGO_ENABLED=0 # modernc.org/sqlite is pure Go
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: tokenator
    ids: [tokenator]
    name_template: "tokenator_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - docs/*.md
      - examples/bench/*.json

checksum:
  name_template: checksums.txt

release:
  # GitHub releases retired 2026-10-20: binaries are release assets on
  # code.middlefork.org, and the tap is smithy/homebrew-tap there.
  # Cut a release from a workstation (sprinkle-runner has no secrets):
  #   git tag -a vX.Y.Z -m ... && git push code-public vX.Y.Z
  #   MIDDLEFORK_TOKEN=$(ho secret get code-public/release-token) \
  #   TAP_SSH_KEY=~/.ssh/id_ed25519 goreleaser release --clean
  disable: true

publishers:
  - name: middlefork
    checksum: true
    cmd: >-
      curl -fsS -T "{{ .ArtifactPath }}"
      -H "Authorization: token {{ .Env.MIDDLEFORK_TOKEN }}"
      "https://code.middlefork.org/api/v1/repos/smithy/tokenator/releases/{{ .Tag }}/assets/{{ .ArtifactName }}"

# Homebrew: a cask installs the pre-built `tokenator` binary on macOS.
# (Homebrew-on-Linux has no casks — Linux users grab the release tarball
# directly or `go install`.)
homebrew_casks:
  - name: tokenator
    binaries:
      - tokenator
    ids:
      - tokenator
    repository:
      owner: smithy
      name: homebrew-tap
      branch: main
      git:
        url: "ssh://code.bcc.sh:23232/smithy/homebrew-tap.git"
        private_key: "{{ .Env.TAP_SSH_KEY }}"
    url:
      template: "https://code.middlefork.org/api/v1/repos/smithy/tokenator/releases/{{ .Tag }}/assets/{{ .ArtifactName }}"
    directory: Casks
    homepage: "https://code.middlefork.org/smithy/tokenator"
    description: "Token and prompt-cache profiler for AI coding agents (Claude Code, OpenCode): usage reports, cache doctor, session browser, A/B bench harness"
    commit_author:
      name: goreleaser-bot
      email: erewhon@flatland.org
    # The binary is unsigned: strip the Gatekeeper quarantine bit on install so
    # it runs without a "developer cannot be verified" prompt.
    # Homebrew 7 deprecates `postflight` blocks (what hooks.post.install
    # renders) for declarative `postflight_steps`; GoReleaser has no steps
    # option, so the stanza goes in custom_block. chdir "." is the staged path.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "tokenator"], chdir: "."
        end
      end
    caveats: |
      Quick start:
        tokenator ingest    # profile your Claude Code / OpenCode transcripts
        tokenator report    # usage rollups with cache splits
        tokenator serve     # session browser web UI on 127.0.0.1:8990

      The database lives at ~/.local/share/tokenator/tokenator.db and stores
      sizes/hashes only — never transcript content.
